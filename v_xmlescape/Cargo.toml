[badges.maintenance]
status = "actively-developed"

[dependencies.v_escape-base]
workspace = true

[features]
alloc = ["v_escape-base/alloc"]
bytes = ["v_escape-base/bytes"]
default = ["std", "string", "fmt", "bytes"]
fmt = ["v_escape-base/fmt"]
std = ["v_escape-base/std", "alloc"]
string = ["v_escape-base/string"]

[package]
description = "SIMD-accelerated XML text escaping"
documentation = "https://docs.rs/v_xmlescape"
edition = "2024"
keywords = ["xml", "escaping", "simd"]
license = "MIT/Apache-2.0"
name = "v_xmlescape"
readme = "README.md"
repository = "https://github.com/lexmount/v_escape"
version = "0.1.0"
workspace = ".."

[package.metadata.docs.rs]
all-features = true
